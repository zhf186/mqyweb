spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  h2:
    console:
      enabled: false

  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.manqiyou: INFO
    org.springframework.security: WARN
    org.springframework.web: INFO

app:
  security:
    allow-dev-endpoints: false
    allow-h2-console: false
